<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보안 PDF 워터마크 생성기 (Client-side PDF Watermarker)</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- External Libraries (CDN) -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-shield-halved"></i>
        <span>PDF Secure Mark</span>
      </div>
      <p class="tagline">100% 로컬 연산 · 문서 유출 방지 워터마크 오버레이</p>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Left Panel: Controls & Options -->
      <section class="control-panel">
        <div class="card">
          <h2 class="card-title"><i class="fa-solid fa-user-shield"></i> 출력자 및 워터마크 정보</h2>
          
          <div class="form-group">
            <label for="userNameInput"><i class="fa-solid fa-user"></i> 출력자 이름 / 사번 / 부서</label>
            <input type="text" id="userNameInput" placeholder="예: 홍길동 (보안팀 / 202609)" value="홍길동 (보안팀)">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ipInput"><i class="fa-solid fa-network-wired"></i> 현재 IP 주소</label>
              <div class="input-with-btn">
                <input type="text" id="ipInput" placeholder="조회 중..." value="조회 중...">
                <button type="button" id="refreshIpBtn" title="IP 다시 조회"><i class="fa-solid fa-rotate-right"></i></button>
              </div>
            </div>

            <div class="form-group">
              <label for="timeInput"><i class="fa-solid fa-clock"></i> 출력 시각</label>
              <input type="text" id="timeInput" readonly>
            </div>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title"><i class="fa-solid fa-sliders"></i> 워터마크 스타일 설정</h2>
          
          <div class="form-row">
            <div class="form-group">
              <label for="fontSizeInput">글자 크기 (<span id="fontSizeVal">10</span>px)</label>
              <input type="range" id="fontSizeInput" min="7" max="18" value="10">
            </div>
            <div class="form-group">
              <label for="opacityInput">투명도 (<span id="opacityVal">0.18</span>)</label>
              <input type="range" id="opacityInput" min="0.05" max="0.50" step="0.01" value="0.18">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="angleInput">회전 각도 (<span id="angleVal">45</span>°)</label>
              <input type="range" id="angleInput" min="0" max="90" step="5" value="45">
            </div>
            <div class="form-group">
              <label for="spacingInput">간격 Density (<span id="spacingVal">160</span>px)</label>
              <input type="range" id="spacingInput" min="100" max="250" step="10" value="160">
            </div>
          </div>

          <div class="form-group">
            <label for="colorInput">워터마크 색상</label>
            <div class="color-picker-wrapper">
              <input type="color" id="colorInput" value="#666666">
              <span id="colorHexText">#666666</span>
            </div>
          </div>
        </div>

        <!-- File Upload Card -->
        <div class="card">
          <h2 class="card-title"><i class="fa-solid fa-file-pdf"></i> PDF 파일 업로드</h2>
          <div class="drop-zone" id="dropZone">
            <i class="fa-solid fa-cloud-arrow-up drop-icon"></i>
            <p class="drop-text">PDF 파일을 드래그 & 드롭하거나 클릭하여 선택하세요</p>
            <span class="drop-subtext">여러 파일 다중 선택 가능 · 파일 서버 전송 없음</span>
            <input type="file" id="fileInput" accept="application/pdf" multiple style="display: none;">
          </div>
        </div>
      </section>

      <!-- Right Panel: Preview & Downloads -->
      <section class="preview-panel">
        <div class="card preview-card">
          <div class="card-header-row">
            <h2 class="card-title"><i class="fa-solid fa-eye"></i> 워터마크 미리보기 및 다운로드</h2>
            <div class="batch-actions" id="batchActions" style="display: none;">
              <button class="btn btn-primary" id="downloadZipBtn">
                <i class="fa-solid fa-file-zipper"></i> 일괄 다운로드 (ZIP)
              </button>
            </div>
          </div>

          <!-- File List & Preview Area -->
          <div id="fileListContainer" class="file-list-container">
            <div class="empty-state">
              <i class="fa-solid fa-file-circle-plus"></i>
              <p>PDF 파일을 업로드하면 미리보기 및 개별/일괄 다운로드가 활성화됩니다.</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p><i class="fa-solid fa-lock"></i> 본 서비스는 사용자의 브라우저 메모리 내에서만 작동하며, 서버로 파일이나 개인정보가 수집/전송되지 않습니다.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
